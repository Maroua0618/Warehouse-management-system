name: mobile
description: "MobAI Warehouse Management System - Mobile Application"
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Network
  dio: ^5.4.0
  http: ^1.2.0
  connectivity_plus: ^5.0.2

  # Local Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # Dependency Injection
  get_it: ^7.6.4

  # Functional Programming
  dartz: ^0.10.1

  # Utils
  intl: ^0.19.0

  # SVG Support
  flutter_svg: ^2.0.9

  # Supabase
  supabase_flutter: ^2.12.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - .env
